name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-dockerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test ./...

      - name: Build Go binary
        run: go build -o server .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t go-app:${{ github.sha }} .

      # Optional: push to Docker Hub. Add DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN as repo secrets (Settings > Secrets > Actions)
      # to enable this step.
      - name: Log in to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          docker tag go-app:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/go-app:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/go-app:latest
